name: Trading KIS Feed Operations

on:
  pull_request:
    paths:
      - "server/src/services/tradingKisFeedOperationalGuard.js"
      - "server/src/services/tradingKisFeedOperationalGuard.test.js"
      - "server/src/services/tradingKisFeedOperationalSupervisor.js"
      - "server/src/services/tradingKisFeedOperationalSupervisor.test.js"
      - "server/src/services/tradingUsEquityMarketCalendar.js"
      - "server/src/services/tradingUsEquityMarketCalendar.test.js"
      - "server/src/services/tradingKisCompletedBarFeedRunner.js"
      - "server/src/services/tradingKisCompletedBarFeedRunner.test.js"
      - "server/src/services/tradingKisShadowFeedRuntimeService.js"
      - "server/src/services/tradingKisShadowFeedRuntimeService.test.js"
      - "server/src/db/tradingKisFeedCheckpointRepository.js"
      - "server/src/db/tradingKisFeedCheckpointRepository.test.js"
      - "server/migrations/20260805_trading_kis_shadow_feed_checkpoints.sql"
      - "src/components/TradingScalpingKisOpsPanel.jsx"
      - "src/components/TradingScalpingKisOpsPanel.css"
      - "src/components/TradingAiMlPanelGroup.jsx"
      - "scripts/check-trading-kis-feed-operations.test.mjs"
      - ".github/workflows/trading-kis-feed-operations.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test KIS feed operations contracts
        run: >-
          node --test
          server/src/services/tradingUsEquityMarketCalendar.test.js
          server/src/services/tradingKisFeedOperationalGuard.test.js
          server/src/db/tradingKisFeedCheckpointRepository.test.js
          server/src/services/tradingKisFeedOperationalSupervisor.test.js
          server/src/services/tradingKisShadowFeedRuntimeService.test.js
          server/src/services/tradingKisCompletedBarFeedRunner.test.js
          server/src/services/tradingKisReadOnlyApproval.test.js
          server/src/services/tradingKisOverseasRealtimeAdapter.test.js
          server/src/services/tradingMinuteBarAggregator.test.js
          scripts/check-trading-kis-feed-operations.test.mjs
      - name: Check backend syntax
        run: |
          node --check server/src/services/tradingUsEquityMarketCalendar.js
          node --check server/src/services/tradingKisFeedOperationalGuard.js
          node --check server/src/db/tradingKisFeedCheckpointRepository.js
          node --check server/src/services/tradingKisFeedOperationalSupervisor.js
          node --check server/src/services/tradingKisCompletedBarFeedRunner.js
          node --check server/src/services/tradingKisShadowFeedRuntimeService.js
      - name: Build frontend
        run: npm run build
