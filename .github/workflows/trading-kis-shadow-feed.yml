name: Trading KIS Shadow Feed

on:
  pull_request:
    paths:
      - "server/src/services/tradingKisReadOnlyApproval*"
      - "server/src/services/tradingKisCompletedBarFeedRunner*"
      - "server/src/services/tradingKisShadowFeedRuntimeService*"
      - "server/src/services/tradingKisOverseasRealtimeAdapter*"
      - "server/src/services/tradingMinuteBarAggregator*"
      - "server/src/routes/adminTradingScalpingRoutes.js"
      - "src/components/TradingScalpingShadowPanel.jsx"
      - "src/components/TradingScalpingKisFeedPanel.css"
      - "src/components/tradingScalpingAdminApi.js"
      - "src/components/TradingAiMlPanelGroup.jsx"
      - "scripts/check-trading-kis-shadow-feed.test.mjs"
      - ".github/workflows/trading-kis-shadow-feed.yml"
      - "docs/trading/FINPLE_KIS_SHADOW_FEED_TSC4D_2026_08_05.md"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test KIS Shadow feed contracts
        run: >-
          node --test
          server/src/services/tradingKisReadOnlyApproval.test.js
          server/src/services/tradingKisCompletedBarFeedRunner.test.js
          server/src/services/tradingKisShadowFeedRuntimeService.test.js
          server/src/services/tradingKisOverseasRealtimeAdapter.test.js
          server/src/services/tradingMinuteBarAggregator.test.js
          scripts/check-trading-kis-shadow-feed.test.mjs
      - name: Check backend syntax
        run: |
          node --check server/src/services/tradingKisReadOnlyApproval.js
          node --check server/src/services/tradingKisCompletedBarFeedRunner.js
          node --check server/src/services/tradingKisShadowFeedRuntimeService.js
          node --check server/src/routes/adminTradingScalpingRoutes.js
      - name: Build frontend
        run: npm run build
