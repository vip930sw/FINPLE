name: Trading Scalping Historical Data Intake

on:
  pull_request:
    paths:
      - "server/src/services/tradingScalpingHistoricalDataIntake.js"
      - "server/src/services/tradingScalpingHistoricalDataIntake.test.js"
      - "docs/trading/FINPLE_SCALPING_HISTORICAL_DATA_INTAKE_TSC4H_2026_08_05.md"
      - "scripts/check-trading-scalping-historical-data-intake.test.mjs"
      - ".github/workflows/trading-scalping-historical-data-intake.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test historical data intake contracts
        run: >-
          node --test
          server/src/services/tradingScalpingHistoricalDataIntake.test.js
          scripts/check-trading-scalping-historical-data-intake.test.mjs
      - name: Check backend syntax
        run: node --check server/src/services/tradingScalpingHistoricalDataIntake.js
      - name: Build frontend
        run: npm run build
