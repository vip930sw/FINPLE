name: Trading Scalping Short-Horizon Model

on:
  pull_request:
    paths:
      - "server/src/services/tradingScalpingShortHorizonModel.js"
      - "server/src/services/tradingScalpingShortHorizonModel.test.js"
      - "server/src/services/tradingScalpingModelSignalAdapter.js"
      - "server/src/services/tradingAiMlDatasetArchitecture.js"
      - "scripts/check-trading-scalping-short-horizon-model.test.mjs"
      - "docs/trading/FINPLE_SCALPING_SHORT_HORIZON_MODEL_TSC4G_2026_08_05.md"
      - ".github/workflows/trading-scalping-short-horizon-model.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test deterministic short-horizon model contracts
        run: >-
          node --test
          server/src/services/tradingScalpingShortHorizonModel.test.js
          server/src/services/tradingScalpingModelSignalAdapter.test.js
          scripts/check-trading-scalping-short-horizon-model.test.mjs
      - name: Check backend syntax
        run: |
          node --check server/src/services/tradingScalpingShortHorizonModel.js
          node --check server/src/services/tradingScalpingShortHorizonModel.test.js
          node --check scripts/check-trading-scalping-short-horizon-model.test.mjs
      - name: Build frontend
        run: npm run build
