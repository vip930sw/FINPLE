name: CASH Policy PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Official portfolio baseline regression
        run: npm run check:official-portfolio-baseline

      - name: Manual CASH focused regression
        run: node --test src/data/tickers/manualCashAsset.test.js

      - name: Canonical Python regression
        run: python -m unittest discover -s tools/canonical_csv/tests -p 'test_*.py' -v

      - name: Production build
        run: npm run build

      - name: AI production check
        run: npm run check:ai-production

      - name: Focused ESLint
        run: >-
          npx eslint
          src/data/tickers/manualCashAsset.js
          src/data/tickers/manualCashAsset.test.js
          src/components/portfolio/constants.js
          src/components/portfolio/utils/portfolioFactory.js
          scripts/check-official-portfolio-baseline.test.mjs

      - name: Diff check
        run: git diff --check
