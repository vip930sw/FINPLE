name: Trading Scalping Model Signal Contract

on:
  pull_request:
    paths:
      - "server/src/services/tradingScalpingModelSignalAdapter.js"
      - "server/src/services/tradingScalpingModelSignalAdapter.test.js"
      - "scripts/check-trading-scalping-model-signal.test.mjs"
      - "docs/trading/FINPLE_SCALPING_MODEL_SIGNAL_TSC4F_2026_08_05.md"
      - ".github/workflows/trading-scalping-model-signal.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test typed model-signal and replay contracts
        run: >-
          node --test
          server/src/services/tradingScalpingModelSignalAdapter.test.js
          scripts/check-trading-scalping-model-signal.test.mjs
      - name: Check backend syntax
        run: node --check server/src/services/tradingScalpingModelSignalAdapter.js
      - name: Build frontend regression
        run: npm run build
